<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F1EE">
<title>Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{chalk:'#F2F1EE',ink:'#1F2A37',iron:'#1D4ED8',flame:'#EA580C'},fontFamily:{display:['"Barlow Condensed"','Arial Narrow','sans-serif'],sans:['Barlow','system-ui','sans-serif']}}}}
</script>
<style>
html,body{background:#F2F1EE;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
input,select,textarea{font-size:16px}
</style>
</head>
<body class="font-sans text-ink">
<header class="sticky top-0 z-10 bg-chalk/95 backdrop-blur border-b-4 border-flame" style="padding-top:env(safe-area-inset-top,0px)">
  <div class="max-w-xl mx-auto px-4 pt-3">
    <h1 class="font-display text-2xl font-bold tracking-wide">Workout Tracker</h1>
    <nav id="nav" class="flex gap-1 -mb-px"></nav>
  </div>
</header>
<main id="app" class="max-w-xl mx-auto px-4 py-4"></main>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 bg-ink text-chalk text-sm px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none"></div>

<script>
const K='liftlog.v1', DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayIdx=d=>(d.getDay()+6)%7;
const weekStart=s=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-dayIdx(d));return iso(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(){
  const plans=[
    {id:'p1',s:1,name:'Push',ex:['Bench Press','Overhead Press','Incline DB Press']},
    {id:'p2',s:1,name:'Pull',ex:['Deadlift','Barbell Row','Pull-Up']},
    {id:'p3',s:1,name:'Legs',ex:['Squat','Leg Press','Romanian Deadlift']}];
  const base={'Bench Press':[135,2.5],'Overhead Press':[85,1.5],'Incline DB Press':[50,1],'Deadlift':[185,5],'Barbell Row':[115,2.5],'Pull-Up':[0,0],'Squat':[155,5],'Leg Press':[270,10],'Romanian Deadlift':[135,5]};
  const logs=[], mon=new Date(); mon.setDate(mon.getDate()-dayIdx(mon)-49);
  for(let w=0;w<8;w++)[[0,0],[2,1],[4,2]].forEach(([off,pi])=>{
    const d=new Date(mon);d.setDate(d.getDate()+w*7+off);
    if(d>new Date())return;
    const sets=[];plans[pi].ex.forEach(e=>{const[b,st]=base[e];for(let i=0;i<3;i++)sets.push({ex:e,w:Math.round(b+st*w),r:e==='Pull-Up'?6+Math.floor(w/3):8-i})});
    logs.push({id:'s'+w+pi,s:1,date:iso(d),plan:plans[pi].name,sets});
  });
  return{plans,schedule:{0:'p1',1:'p2',2:'p3',3:null,4:'p1',5:'p2',6:null},logs,
    maxes:{'Bench Press':{orm:185,reps:10,s:1},'Squat':{orm:225,reps:8,s:1},'Deadlift':{orm:275,reps:6,s:1}}};
}
let S;
try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save')}};
save();
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}

let tab='schedule', D={pid:null,sets:[]}, metric='vol', chart=null;
const TABS=[['schedule','Schedule'],['workout','Workout'],['analysis','Analysis']];
const card='bg-white rounded-xl border border-ink/10 p-4';
const inp='w-full rounded-lg border border-ink/20 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-iron';
const btn='rounded-lg px-4 py-2 font-semibold active:scale-95 transition';
const btnP=btn+' bg-iron text-white', btnG=btn+' border border-ink/20 bg-white';

function go(t){tab=t;render();scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button onclick="go('${k}')" class="flex-1 py-2.5 text-center font-semibold border-b-2 ${tab===k?'border-iron text-iron':'border-transparent text-ink/50'}">${l}</button>`).join('');
  $('#app').innerHTML={schedule:vSchedule,workout:vWorkout,analysis:vAnalysis}[tab]();
  if(tab==='analysis')drawChart();
}

/* ---------- Schedule ---------- */
function vSchedule(){
  const now=new Date(), t=dayIdx(now), mon=new Date(now);mon.setDate(now.getDate()-t);
  const opts=v=>`<option value="">Rest</option>`+S.plans.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('');
  return `<p class="text-ink/60 mb-3 text-sm">Pick a workout for each day. A check appears once you log that day.</p><div class="space-y-2">`+
  DAYS.map((d,i)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+i);const done=S.logs.some(l=>l.date===iso(dt));
    return `<div class="${card} flex items-center gap-3 ${i===t?'ring-2 ring-flame':''}">
      <div class="w-14"><div class="font-display text-xl font-bold">${d}</div><div class="text-xs text-ink/50">${dt.getMonth()+1}/${dt.getDate()}</div></div>
      <select class="${inp} flex-1" onchange="setSched(${i},this.value)">${opts(S.schedule[i])}</select>
      <div class="w-6 text-flame text-xl font-bold">${done?'✓':''}</div></div>`}).join('')+`</div>`;
}
function setSched(i,v){S.schedule[i]=v||null;save();toast('Schedule saved')}

/* ---------- Workout ---------- */
function pickPlan(id){
  const p=S.plans.find(x=>x.id===id);
  D={pid:id,sets:p?p.ex.map(()=>[{w:'',r:''}]):[]};
}
function vWorkout(){
  if(D.pid===null&&S.plans.length){const sp=S.schedule[dayIdx(new Date())];if(sp&&S.plans.some(p=>p.id===sp))pickPlan(sp)}
  const plan=S.plans.find(p=>p.id===D.pid);
  let h=`<div class="${card} mb-4"><label class="text-sm text-ink/60">Today's workout</label>
    <select class="${inp} mt-1" onchange="pickPlan(this.value);render()"><option value="">Choose a plan…</option>${S.plans.map(p=>`<option value="${p.id}" ${p.id===D.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
  if(plan){
    h+=plan.ex.map((e,j)=>`<div class="${card} mb-3"><div class="font-display text-xl font-bold mb-2">${esc(e)}</div>
      ${D.sets[j].map((s,i)=>`<div class="flex items-center gap-2 mb-2"><span class="w-12 text-sm text-ink/50">Set ${i+1}</span>
        <input type="number" inputmode="decimal" placeholder="lbs" value="${s.w}" class="${inp}" oninput="D.sets[${j}][${i}].w=this.value">
        <span class="text-ink/40">×</span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" class="${inp}" oninput="D.sets[${j}][${i}].r=this.value"></div>`).join('')}
      <button class="${btnG} text-sm" onclick="D.sets[${j}].push({w:'',r:''});render()">Add set</button></div>`).join('');
    h+=`<button class="${btn} bg-flame text-white w-full py-3 mb-6" onclick="finish()">Finish workout</button>`;
  }
  h+=`<details class="${card} mb-3"><summary class="font-semibold cursor-pointer">Create a workout plan</summary>
    <input id="pn" class="${inp} mt-3" placeholder="Plan name (e.g. Chest 1)">
    <textarea id="pe" rows="5" class="${inp} mt-2" placeholder="One exercise per line"></textarea>
    <button class="${btnP} mt-2" onclick="addPlan()">Save plan</button></details>`;
  if(S.plans.length)h+=`<div class="${card}"><div class="font-semibold mb-2">Your plans</div>`+S.plans.map(p=>`<div class="flex items-center justify-between py-2 border-t border-ink/10 first:border-0"><div><div class="font-medium">${esc(p.name)}</div><div class="text-xs text-ink/50">${p.ex.map(esc).join(', ')}</div></div><button class="text-sm text-red-700 px-2" onclick="delPlan('${p.id}')">Delete</button></div>`).join('')+`</div>`;
  return h;
}
function addPlan(){
  const name=$('#pn').value.trim(), ex=$('#pe').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name||!ex.length)return toast('Add a name and at least one exercise');
  S.plans.push({id:'p'+Date.now(),name,ex});save();toast('Plan saved');render();
}
function delPlan(id){
  if(!confirm('Delete this plan? Logged workouts stay.'))return;
  S.plans=S.plans.filter(p=>p.id!==id);Object.keys(S.schedule).forEach(k=>{if(S.schedule[k]===id)S.schedule[k]=null});
  if(D.pid===id)D={pid:null,sets:[]};save();render();
}
function finish(){
  const plan=S.plans.find(p=>p.id===D.pid), sets=[];
  plan.ex.forEach((e,j)=>D.sets[j].forEach(s=>{if(+s.w>=0&&s.w!==''&&+s.r>0)sets.push({ex:e,w:+s.w,r:+s.r})}));
  if(!sets.length)return toast('Enter at least one set');
  S.logs.push({id:'l'+Date.now(),date:iso(new Date()),plan:plan.name,sets});save();
  D={pid:null,sets:[]};toast('Workout saved');go('analysis');
}

/* ---------- Analysis ---------- */
function names(){
  const n=new Set(Object.keys(S.maxes));S.plans.forEach(p=>p.ex.forEach(e=>n.add(e)));S.logs.forEach(l=>l.sets.forEach(s=>n.add(s.ex)));
  return[...n].sort();
}
let NAMES=[];
function vAnalysis(){
  NAMES=names();
  const opts=`<option value="vol">Weekly volume (lbs)</option>`+NAMES.map((n,i)=>`<option value="${i}" ${String(i)===metric?'selected':''}>Top weight: ${esc(n)}</option>`).join('');
  const hasSample=S.logs.some(l=>l.s)||S.plans.some(p=>p.s)||Object.values(S.maxes).some(m=>m.s);
  return `<div class="${card} mb-4"><select class="${inp} mb-3" onchange="metric=this.value;drawChart()">${opts}</select>
    <div class="relative h-64"><canvas id="ch"></canvas></div>
    <p id="empty" class="text-sm text-ink/50 text-center hidden">No workouts logged yet.</p></div>
  <div class="${card} mb-4"><div class="font-semibold mb-1">Personal records</div>
    <p class="text-xs text-ink/50 mb-3">Enter your real one-rep max and best reps (at any weight you choose to track).</p>
    <div class="grid grid-cols-[1fr_5rem_4rem] gap-2 text-xs text-ink/50 mb-1"><span>Exercise</span><span>1RM (lbs)</span><span>Reps</span></div>
    ${NAMES.map((n,i)=>{const m=S.maxes[n]||{};return `<div class="grid grid-cols-[1fr_5rem_4rem] gap-2 items-center mb-2"><span class="font-medium text-sm truncate">${esc(n)}</span>
      <input type="number" inputmode="decimal" value="${m.orm??''}" class="${inp} !px-2 !py-1.5" onchange="setMax(${i},'orm',this.value)">
      <input type="number" inputmode="numeric" value="${m.reps??''}" class="${inp} !px-2 !py-1.5" onchange="setMax(${i},'reps',this.value)"></div>`}).join('')||'<p class="text-sm text-ink/50">Create a plan to see exercises here.</p>'}
    <div class="flex gap-2 mt-3"><input id="nx" class="${inp}" placeholder="Add another exercise"><button class="${btnG}" onclick="addEx()">Add</button></div></div>
  <div class="${card}"><div class="font-semibold mb-3">Your data</div><div class="flex flex-wrap gap-2">
    <button class="${btnP}" onclick="exportData()">Export</button>
    <label class="${btnG} cursor-pointer">Import<input type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])"></label>
    ${hasSample?`<button class="${btnG} text-red-700" onclick="clearSample()">Clear sample data</button>`:''}</div></div>`;
}
function setMax(i,f,v){const n=NAMES[i];S.maxes[n]=S.maxes[n]||{};delete S.maxes[n].s;S.maxes[n][f]=v===''?'':+v;save();toast('Saved')}
function addEx(){const n=$('#nx').value.trim();if(!n)return;S.maxes[n]=S.maxes[n]||{};save();render()}
function drawChart(){
  const wk={},top={};
  S.logs.forEach(l=>{const w=weekStart(l.date);wk[w]=(wk[w]||0)+l.sets.reduce((a,s)=>a+s.w*s.r,0);
    l.sets.forEach(s=>{(top[s.ex]=top[s.ex]||{})[w]=Math.max((top[s.ex]||{})[w]||0,s.w)})});
  const isVol=metric==='vol', src=isVol?wk:(top[NAMES[+metric]]||{});
  const labels=Object.keys(src).sort();
  if(chart)chart.destroy();
  const cv=$('#ch');if(!cv)return;
  $('#empty').classList.toggle('hidden',labels.length>0);
  chart=new Chart(cv,{type:isVol?'bar':'line',data:{labels:labels.map(l=>l.slice(5).replace('-','/')),datasets:[{label:isVol?'Volume (lbs)':'Top weight (lbs)',data:labels.map(l=>src[l]),backgroundColor:isVol?'#1D4ED8':'#EA580C',borderColor:isVol?'#1D4ED8':'#EA580C',tension:.3,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:isVol,grid:{color:'#0001'}},x:{grid:{display:false},title:{display:true,text:'Week starting'}}}}});
}
function exportData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='lift-log-'+iso(new Date())+'.json';a.click();toast('Exported');
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.plans||!d.logs||!d.schedule||!d.maxes)throw 0;
    if(!confirm('Replace all current data with this file?'))return;S=d;save();render();toast('Imported')}catch(e){toast('That file is not a  export')}};
  r.readAsText(f);
}
function clearSample(){
  if(!confirm('Remove the sample plans, workouts and records?'))return;
  S.logs=S.logs.filter(l=>!l.s);S.plans=S.plans.filter(p=>!p.s);
  Object.keys(S.maxes).forEach(k=>{if(S.maxes[k].s)delete S.maxes[k]});
  Object.keys(S.schedule).forEach(k=>{if(!S.plans.some(p=>p.id===S.schedule[k]))S.schedule[k]=null});
  D={pid:null,sets:[]};save();render();toast('Sample data cleared');
}
render();
</script>
</body>
</html>
